[build]
  command = "npm run build"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://kifzldev-replit.replit.dev/api/:splat"
  status = 200
  force = true

[context.production.environment]
  VITE_API_URL = "https://kifzldev-replit.replit.dev"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
